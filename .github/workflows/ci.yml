name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp test

  integration:
    name: Integration tests on ${{ matrix.server }}
    runs-on: ubuntu-latest
    needs: unit
    # All three servers have passed on the maintainer's machine. The flag stays so a server can be demoted without editing the job.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: payara
            experimental: false
          - server: wildfly
            experimental: false
          - server: liberty
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Let Testcontainers talk to newer Docker engines
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: Package and run the integration tests
        run: mvn -B -ntp verify -Dmcp.server=${{ matrix.server }} -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
