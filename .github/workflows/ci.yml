name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp test

  release-check:
    name: Release build (sources, Javadoc)
    runs-on: ubuntu-latest
    # The profile Maven Central needs, minus signing and upload: a Javadoc error fails here instead of at release time.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: scripts/release-check.sh

  integration:
    name: Integration tests on ${{ matrix.server }}
    runs-on: ubuntu-latest
    needs: unit
    # All three servers have passed on the maintainer's machine. The flag stays so a server can be demoted without editing the job.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: payara
            experimental: false
          - server: wildfly
            experimental: false
          - server: liberty
            experimental: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Let Testcontainers talk to newer Docker engines
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: Package and run the integration tests
        run: mvn -B -ntp verify -Dmcp.server=${{ matrix.server }} -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false

  conformance:
    name: MCP conformance suite
    runs-on: ubuntu-latest
    needs: unit
    # The scenarios this server is known to fail are listed in mcp-example-conformance/expected-failures.yml (none at the moment). The Tasks extension is switched on for this job.
    # Any other failure, and any listed scenario that starts to pass, fails the job.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the fixture WAR
        run: mvn -B -ntp -q -DskipTests package -pl mcp-example-conformance -am
      - name: Start Payara Micro
        run: |
          docker run -d --name mcp -p 8080:8080 -e MCP_TASKS_ENABLED=true -v "$PWD/mcp-example-conformance/target/mcp-conformance.war:/opt/payara/deployments/ROOT.war" payara/micro:latest
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' http://localhost:8080/mcp -d '{}' || true)
            [ "$code" != "000" ] && [ "$code" != "404" ] && break
            sleep 2
          done
      - name: Run the suite
        shell: bash
        run: npx --yes @modelcontextprotocol/conformance@alpha server --url http://localhost:8080/mcp --requirements 2026-07-28 --expected-failures mcp-example-conformance/expected-failures.yml -o results 2>&1 | tee all.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: conformance-results
          path: |
            all.txt
            results
